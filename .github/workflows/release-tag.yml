name: Build And Release (Tag)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build macOS app
        run: wails build -clean -platform darwin/universal

      - name: Package macOS artifact
        run: |
          APP_PATH="build/bin/stock-position.app"
          ZIP_NAME="stock-position-${GITHUB_REF_NAME}-macos-universal.zip"
          if [ ! -d "$APP_PATH" ]; then
            echo "Expected app not found: $APP_PATH"
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "build/bin/$ZIP_NAME"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: build/bin/stock-position-*-macos-universal.zip
          if-no-files-found: error

  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0
          $goPath = go env GOPATH
          "$goPath\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build Windows app + installer
        run: wails build -clean -platform windows/amd64 -nsis

      - name: Package Windows artifact
        shell: pwsh
        run: |
          $zipName = "stock-position-$env:GITHUB_REF_NAME-windows-amd64.zip"
          $files = Get-ChildItem -Path build/bin -File | Where-Object { $_.Extension -eq ".exe" }
          if (-not $files) {
            throw "No .exe files found in build/bin"
          }
          Compress-Archive -Path $files.FullName -DestinationPath "build/bin/$zipName" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: build/bin/stock-position-*-windows-amd64.zip
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-macos
      - build-windows

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/**/*.zip
          fail_on_unmatched_files: true
